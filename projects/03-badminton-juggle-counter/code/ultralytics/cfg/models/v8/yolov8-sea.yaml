# Ultralytics YOLO 🚀, AGPL-3.0 license

# Parameters
nc: 80  # 类别数量
depth_multiple: 0.33  # 模型深度系数
width_multiple: 0.50  # 模型宽度系数

# YOLOv8.0s backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]         # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]        # 1-P2/4
  - [-1, 3, C2f, [128, True]]         # 2
  - [-1, 1, Conv, [256, 3, 2]]        # 3-P3/8
  - [-1, 6, C2f, [256, True]]         # 4 (P3 aida) -> 输出通道 = 128
  - [-1, 1, SEAttention, [128]]       # 5 <-- 将 256 修改为 128

  - [-1, 1, Conv, [512, 3, 2]]        # 6-P4/16
  - [-1, 6, C2f, [512, True]]         # 7 (P4 aida) -> 输出通道 = 256
  - [-1, 1, SEAttention, [256]]       # 8 <-- 此处保持 256 (512 * 0.5)

  - [-1, 1, Conv, [1024, 3, 2]]       # 9-P5/32
  - [-1, 3, C2f, [1024, True]]        # 10 (P5 aida) -> 输出通道 = 512
  - [-1, 1, SEAttention, [512]]       # 11 <-- 将 1024 修改为 512

  - [-1, 1, SPPF, [1024, 5]]          # 12

# YOLOv8.0s head (Neck)
# 注意：head部分的连接索引也需要相应更新
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 8], 1, Concat, [1]]           # cat backbone P4, P4的输出现在是第8层
  - [-1, 3, C2f, [512]]                 # 15

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 5], 1, Concat, [1]]           # cat backbone P3, P3的输出现在是第5层
  - [-1, 3, C2f, [256]]                 # 18 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]          # cat head P4
  - [-1, 3, C2f, [512]]                 # 21 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]          # cat head P5
  - [-1, 3, C2f, [1024]]                # 24 (P5/32-large)

  - [[18, 21, 24], 1, Detect, [nc]]   # Detect(P3, P4, P5)