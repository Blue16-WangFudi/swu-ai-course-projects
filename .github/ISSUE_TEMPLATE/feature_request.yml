name: Feature request
description: Suggest an improvement (docs, structure, demos, smoke tests).
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Documentation
        - Smoke tests
        - Project structure
        - Demo/inference workflow
        - CI / automation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see added/changed?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches?
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I understand that datasets/weights/slides are not hosted in this repository.
          required: true
        - label: I will not submit large binaries in a PR (weights, datasets, videos, PPT).
          required: true

